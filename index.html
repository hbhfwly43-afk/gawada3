<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة تحميل التطبيق</title>
    <!-- خط Cairo ورابط FontAwesome للأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-start: #0f172a;
            --bg-end: #1e293b;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .app-icon-wrapper {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px;
        }

        .app-icon {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 22px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.15);
        }

        .app-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .app-desc {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn-download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            border-radius: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
        }

        .btn-download:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(37, 99, 235, 0.45);
        }

        .file-info {
            margin-top: 18px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-sub);
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- شعار التطبيق -->
        <div class="app-icon-wrapper">
            <img src="Gemini_Generated_Image_17ba5317ba5317ba.jpg" alt="شعار التطبيق" class="app-icon">
        </div>

        <h1 class="app-title">دليل جوادة</h1>
        <p class="app-desc">اضغط على الزر بالأسفل لبدء تنزيل ملف الـ APK المباشر.</p>

        <!-- زر التحميل بالرابط المباشر من Google Drive -->
        <a href="https://drive.google.com/file/d/1jEenDEew0sDirdI0o75VMbIitWeKRyo2/view?usp=sharing" class="btn-download">
            <i class="fa-solid fa-download"></i>
            <span>تحميل التطبيق (APK)</span>
        </a>

        <!-- حجم الملف -->
        <div class="file-info">
            <i class="fa-solid fa-hard-drive"></i>
            <span>الحجم: 25 ميجابايت</span>
        </div>
    </div>

</body>
</html>
